<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Administration — 7MP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    :root { --vert:#2E7D32; --jaune:#F9A825; --noir:#111111; --gris:#F4F4F4; --rouge:#C62828; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Barlow',sans-serif; background:linear-gradient(135deg,#0a1628 0%,#1b3a1b 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .login-card { background:#fff; width:100%; max-width:420px; padding:48px 40px; box-shadow:0 20px 60px rgba(0,0,0,0.4); border-top:6px solid var(--jaune); }
    .login-logo { font-family:'Playfair Display',serif; font-size:3rem; font-weight:900; color:var(--vert); text-align:center; line-height:1; margin-bottom:4px; }
    .login-subtitle { text-align:center; color:#888; font-size:0.85rem; margin-bottom:36px; }
    .login-card h2 { font-family:'Playfair Display',serif; font-size:1.4rem; font-weight:700; margin-bottom:24px; }
    .login-badge { background:var(--gris); border-left:3px solid var(--jaune); padding:10px 14px; font-size:0.8rem; color:#555; margin-bottom:24px; }
    .form-label-custom { font-weight:700; font-size:0.88rem; margin-bottom:6px; display:block; }
    .form-control-custom { width:100%; border:1.5px solid #ddd; padding:12px 16px; font-size:0.95rem; font-family:'Barlow',sans-serif; outline:none; transition:border-color 0.2s; }
    .form-control-custom:focus { border-color:var(--vert); }
    .btn-login { width:100%; background:var(--vert); color:#fff; border:none; padding:14px; font-weight:700; font-size:1rem; cursor:pointer; transition:all 0.25s; margin-top:8px; letter-spacing:0.05em; }
    .btn-login:hover { background:#1b5e20; }
    .alert-error { background:#ffebee; border-left:3px solid var(--rouge); padding:10px 14px; font-size:0.85rem; color:var(--rouge); margin-bottom:16px; }
    .back-link { text-align:center; margin-top:20px; }
    .back-link a { color:#aaa; font-size:0.82rem; text-decoration:none; }
    .back-link a:hover { color:var(--vert); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">7MP</div>
    <div class="login-subtitle">Parti pour les 7 Merveilles du Peuple Gabonais</div>
    <h2><i class="fas fa-lock me-2" style="color:var(--vert);font-size:1.1rem;"></i>Espace Administrateur</h2>
    <div class="login-badge"><i class="fas fa-shield-alt me-2" style="color:var(--jaune);"></i>Accès réservé au Secrétariat Général</div>

    {% if messages %}
      {% for message in messages %}
        <div class="alert-error"><i class="fas fa-times-circle me-2"></i>{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="mb-4">
        <label class="form-label-custom">Identifiant</label>
        <input class="form-control-custom" type="text" name="username" placeholder="Votre identifiant..." required/>
      </div>
      <div class="mb-4">
        <label class="form-label-custom">Mot de passe</label>
        <input class="form-control-custom" type="password" name="password" placeholder="Votre mot de passe..." required/>
      </div>
      <button class="btn-login" type="submit"><i class="fas fa-sign-in-alt me-2"></i>Se connecter</button>
    </form>
    <div class="back-link"><a href="/"><i class="fas fa-arrow-left me-1"></i>Retour au site</a></div>
  </div>
</body>
</html>
