<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <title>Confirmer suppression — 7MP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css"/>
  <style>
    body { font-family:'Barlow',sans-serif; background:#F4F4F4; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:#fff; padding:40px; max-width:480px; width:100%; border-top:6px solid #C62828; box-shadow:0 4px 24px rgba(0,0,0,0.1); }
    h3 { font-size:1.3rem; font-weight:700; margin-bottom:16px; }
    .nom { font-weight:700; color:#C62828; font-size:1.1rem; }
    .btn-danger-custom { background:#C62828; color:#fff; border:none; padding:12px 28px; font-weight:700; cursor:pointer; margin-right:8px; }
    .btn-cancel { background:#eee; color:#333; border:none; padding:12px 28px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; }
  </style>
</head>
<body>
  <div class="card">
    <h3><i class="fas fa-exclamation-triangle text-danger me-2"></i>Confirmer la suppression</h3>
    <p>Êtes-vous sûr de vouloir supprimer la fiche de :</p>
    <p class="nom my-3">{{ a.prenoms }} {{ a.noms }}</p>
    <p style="color:#888;font-size:0.88rem;">Cette action est irréversible.</p>
    <div class="mt-4">
      <form method="POST">
        {% csrf_token %}
        <button class="btn-danger-custom" type="submit"><i class="fas fa-trash me-1"></i>Supprimer</button>
        <a class="btn-cancel" href="/dashboard/">Annuler</a>
      </form>
    </div>
  </div>
</body>
</html>
